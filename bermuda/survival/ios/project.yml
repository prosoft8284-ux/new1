# XcodeGen project for BERMUDA SURVIVAL (iOS).
#   brew install xcodegen && cd bermuda/survival/ios && ./sync-www.sh && xcodegen
# Then open BermudaSurvival.xcodeproj in Xcode.
name: BermudaSurvival
options:
  bundleIdPrefix: com.bermudasurvival
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BermudaSurvival:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bermudasurvival.game
        PRODUCT_NAME: BermudaSurvival
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BERMUDA
        CFBundleShortVersionString: "4.1"
        CFBundleVersion: "1"
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
