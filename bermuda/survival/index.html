<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>BERMUDA SURVIVAL — نقشه‌ی جزیره</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="map" aria-label="نقشه جزیره"></canvas>
<canvas id="fx"></canvas>

<!-- ============ LOADING ============ -->
<div id="loading">
  <div class="load-box">
    <div class="load-logo">BERMUDA<span>SURVIVAL</span></div>
    <div class="load-bar"><i id="loadFill"></i></div>
    <div class="load-txt" id="loadTxt">در حال ساخت جزیره…</div>
  </div>
</div>

<!-- ============ TOP BAR ============ -->
<header id="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-txt">
      <b>BERMUDA SURVIVAL</b>
      <small>جزیره‌ی برمودا · نقشه‌ی تاکتیکی زنده</small>
    </div>
  </div>
  <div class="threat">
    <span class="dot"></span>
    <span id="threatTxt">تهدید فضایی: بحرانی</span>
  </div>
</header>

<!-- ============ LEGEND ============ -->
<aside id="legend" class="panel">
  <button id="legendToggle" class="panel-head" type="button">
    <span class="ph-icon"></span>
    <span>راهنمای نقشه</span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg>
  </button>
  <div class="panel-body" id="legendBody"></div>
</aside>

<!-- ============ COMPASS ============ -->
<div id="compass" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" class="cring"/>
    <circle cx="50" cy="50" r="30" class="cring2"/>
    <path d="M50 12 L58 50 L50 88 L42 50 Z" class="cneedle"/>
    <path d="M50 12 L58 50 L42 50 Z" class="cnorth"/>
    <circle cx="50" cy="50" r="3.4" class="cpin"/>
    <text x="50" y="8" class="clab">N</text>
    <text x="50" y="97" class="clab">S</text>
    <text x="95" y="53" class="clab">E</text>
    <text x="5" y="53" class="clab">W</text>
  </svg>
</div>

<!-- ============ RIGHT TOOLS (zoom) ============ -->
<div id="tools">
  <button class="tbtn" id="zin" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="tbtn" id="zout" title="کوچک‌نمایی" aria-label="کوچک‌نمایی">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
  <button class="tbtn" id="zfit" title="نمای کامل جزیره" aria-label="نمای کامل جزیره">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <a class="tbtn" href="preview.html" title="پیش‌نمایش صحنه‌ی بازی" aria-label="پیش‌نمایش صحنه‌ی بازی">
    <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
  </a>
</div>

<!-- ============ BOTTOM LEFT: SCALE + TOGGLES ============ -->
<div id="hud">
  <div class="scale">
    <div class="scale-bar"><i></i><span id="scaleTxt">۱ کیلومتر</span></div>
    <div class="coords" id="coords">—</div>
  </div>
  <div class="toggles">
    <button class="tg on" data-tg="markers">نشانگرها</button>
    <button class="tg on" data-tg="labels">برچسب‌ها</button>
    <button class="tg" data-tg="grid">شبکه</button>
  </div>
</div>

<!-- ============ POI CARD ============ -->
<div id="card" class="panel hidden">
  <button class="card-x" id="cardX" aria-label="بستن">✕</button>
  <div class="card-top">
    <span class="card-icon" id="cardIcon"></span>
    <div>
      <h2 id="cardTitle">—</h2>
      <div class="card-sub" id="cardSub">—</div>
    </div>
  </div>
  <p id="cardDesc"></p>
  <div class="card-rows" id="cardRows"></div>
  <div class="card-foot">
    <span class="risk" id="cardRisk">—</span>
    <button class="card-go" id="cardGo">مسیریابی</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/tiles.js"></script>
<script src="js/map.js"></script>
<script src="js/save.js"></script>
<script src="js/app.js"></script>
</body>
</html>
