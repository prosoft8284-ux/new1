<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۴۰۰۰ سوال — برنامه تا کنکور</title>
<meta name="theme-color" content="#16324f">
<meta name="description" content="اپ اندروید بانک ۴۰۰۰ سوالی جامعه‌شناسی با برنامه‌ای که تا روز کنکور (۱۶ اردیبهشت) چیده می‌شود">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="6.5" fill="#16324f"/>
        <path d="M12 3.4l1.05 2.4 2.4 1.05-2.4 1.05L12 10.3l-1.05-2.4L8.55 6.85l2.4-1.05Z" fill="#e9a43e"/>
        <path d="M4.4 11.6l6.6.75v5.5l-6.6-1.1Z" fill="#f6f1e5"/>
        <path d="M19.6 11.6l-6.6.75v5.5l6.6-1.1Z" fill="#f6f1e5"/>
        <path d="M11.4 12.3h1.2v5.7h-1.2Z" fill="#ded5c3"/>
        <path d="M6.1 20.9h11.8" stroke="#e9a43e" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <div class="brand-t">
      <b>بانک ۴۰۰۰ سوالی</b>
      <small id="hdr-sub">برنامه تا کنکور</small>
    </div>
  </div>
  <button class="icon-btn" data-act="settings" aria-label="تنظیمات">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/>
    </svg>
  </button>
</header>

<main id="main">
  <section class="view" id="view-today"></section>
  <section class="view hidden" id="view-plan"></section>
  <section class="view hidden" id="view-review"></section>
  <section class="view hidden" id="view-progress"></section>
  <section class="view hidden" id="view-help"></section>
  <section class="view hidden" id="view-day"></section>
  <section class="view hidden" id="view-study"></section>
  <section class="view hidden" id="view-exam"></section>
  <section class="view hidden" id="view-result"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-tab="today" class="on">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v3M17 3v3M4 9h16M5 5.5h14A1.5 1.5 0 0 1 20.5 7v12A1.5 1.5 0 0 1 19 20.5H5A1.5 1.5 0 0 1 3.5 19V7A1.5 1.5 0 0 1 5 5.5Z"/><path d="M8 13h4"/></svg>
    امروز
  </button>
  <button data-act="tab" data-tab="plan">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
    برنامه
  </button>
  <button data-act="tab" data-tab="review">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.5V9h4.5"/></svg>
    مرور
  </button>
  <button data-act="tab" data-tab="progress">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    پیشرفت
  </button>
  <button data-act="tab" data-tab="help">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.5-1.2 1-1.2 1.9"/><path d="M12 17h.01"/></svg>
    راهنما
  </button>
</nav>

<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>

<script src="/vendor-notifications.js"></script>
<script src="/core.js"></script>
<script src="/app.js"></script>
</body>
</html>
